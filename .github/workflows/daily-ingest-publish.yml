name: Daily Ingest & Publish

# 持续爬取入口:当用户向 data-raw/html/ 提交新 XHS 笔记 HTML,或每天 09:00 北京时间,
# 自动跑 ingest → dedupe → validate → export-topics,生成 docs/BROWSE.md 浏览报告并推回 main。
# 所有逻辑跑在 GitHub Actions 上,不依赖任何外部 TRAE 会话或凭据。

on:
  schedule:
    # 每天 01:00 UTC = 09:00 北京时间
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data-raw/html/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: daily-ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 用于把 ingest 结果和 docs/BROWSE.md 推回 main
  pull-requests: write

jobs:
  ingest-and-publish:
    name: Ingest · Validate · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout (with LFS for images)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # 需要 history 才能正确 diff / commit

      - name: 2. Configure git identity for commit-back
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 3. Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 4. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 5. Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          python3 -m pip install --quiet --user pyyaml

      - name: 6. Crawl real website (Minkelxy/ningxia-tourism 姊妹仓库)
        id: crawl
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 真爬真实网站(GitHub 公有仓库 Minkelxy/ningxia-tourism)的真实宁夏旅游内容,
          # 落到 data-raw/crawled/ + 渲染成 docs/crawled/<slug>.md 可在 GitHub 直接浏览。
          # 脚本用 fetch 直连 GitHub Contents API,公共仓库无需 token;GH_TOKEN 存在则带上提高限额。
          npm run crawl:github -- \
            --source-repo Minkelxy/ningxia-tourism \
            --paths src/content/journal README.md XHS-SCRAPER-REFERENCE.md docs/content \
            --out-dir docs/crawled \
            --raw-dir data-raw/crawled
          CRAWLED_COUNT=$(find docs/crawled -name '*.md' -type f ! -name 'INDEX.md' | wc -l | tr -d ' ')
          echo "crawled=$CRAWLED_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ docs/crawled/ 共 $CRAWLED_COUNT 篇真实内容已就绪"

      - name: 6b. Crawl Wikipedia (zh.wikipedia.org 宁夏相关词条)
        id: wiki
        continue-on-error: true   # Wikipedia 偶发限流不应阻断整个 run
        shell: bash
        run: |
          # 真爬真实网站 zh.wikipedia.org 的宁夏相关词条(行政区划/地理/景点/交通等),
          # 落到 data-raw/wikipedia/ + 渲染成 docs/wikipedia/<slug>.md 可在 GitHub 直接浏览。
          # Wikipedia 文本 CC BY-SA 3.0,每页脚注标注原作者与原文链接。
          npm run crawl:wikipedia -- \
            --max-articles 60 \
            --out-dir docs/wikipedia \
            --raw-dir data-raw/wikipedia
          WIKI_COUNT=$(find docs/wikipedia -name '*.md' -type f ! -name 'INDEX.md' | wc -l | tr -d ' ')
          echo "wiki=$WIKI_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ docs/wikipedia/ 共 $WIKI_COUNT 篇真实维基内容已就绪"

      - name: 6c. Crawl Weibo (m.weibo.cn + 人工辅助登录 cookie)
        id: weibo
        continue-on-error: true   # cookie 失效/限流不阻断 run
        shell: bash
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          # 用人工辅助登录导出的 cookie 走 m.weibo.cn JSON 接口,
          # 按关键词搜宁夏旅游相关微博,落 docs/weibo/<mid>.md 可在 GitHub 直接浏览。
          # secret 未设时优雅跳过(不阻断 run;设置后下次自动生效)。
          if [ -z "$WEIBO_COOKIE" ]; then
            echo "⚠️ WEIBO_COOKIE secret 未设置,跳过微博爬取(登录 m.weibo.cn 导出 cookie 设为 secret 后下次自动生效)"
            echo "weibo=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run crawl:weibo -- \
            --max-posts 60 \
            --max-per-keyword 20 \
            --out-dir docs/weibo \
            --raw-dir data-raw/weibo \
            --img-dir images/weibo
          WEIBO_COUNT=$(find docs/weibo -name '*.md' -type f ! -name 'INDEX.md' | wc -l | tr -d ' ')
          echo "weibo=$WEIBO_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ docs/weibo/ 共 $WEIBO_COUNT 条微博已就绪"

      - name: 6d. Search XHS noteIds (Playwright headless + cookie 注入,远端自动搜)
        id: xhs_search
        continue-on-error: true   # cookie 失效/被风控/无浏览器不阻断 run
        shell: bash
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          # 远端用 XHS_COOKIE 注入到 Playwright context(headless),自动搜宁夏
          # 关键词滚动收集 noteId,追加写 data-raw/xhs/note-ids.txt。
          # 绕过小红书 x-s 签名(真实浏览器渲染搜索结果页,从 DOM 提取 noteId)。
          # 本地也可用 npm run login:xhs 持久化登录态后跑(无 cookie 走 user-data-dir)。
          if [ -z "$XHS_COOKIE" ]; then
            echo "⚠️ XHS_COOKIE secret 未设置,跳过搜索(本地 npm run login:xhs 导出 cookie 设为 secret 后下次自动生效)"
            echo "xhs_search=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 装 Playwright 浏览器(headless 需 chromium-headless-shell,install chromium 含两者)
          npx playwright install --with-deps chromium 2>&1 | tail -2 || npx playwright install chromium 2>&1 | tail -2
          npm run search:xhs -- --headless
          IDS=$(grep -cvE '^\s*(#|$)' data-raw/xhs/note-ids.txt 2>/dev/null || echo 0)
          echo "xhs_search=$IDS" >> "$GITHUB_OUTPUT"
          echo "✅ data-raw/xhs/note-ids.txt 共 $IDS 个 noteId(供 6e 抓取)"

      - name: 6e. Crawl XHS (www.xiaohongshu.com + cookie,读 note-ids.txt 抓笔记)
        id: xhs
        continue-on-error: true   # cookie 失效/限流不阻断 run
        shell: bash
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          # 读 6d 搜到的 noteId(或本地手填) + cookie 抓 explore 页,
          # 解析 __INITIAL_STATE__ 抓笔记+图片,落 docs/xhs/<noteId>.md。
          if [ -z "$XHS_COOKIE" ]; then
            echo "⚠️ XHS_COOKIE secret 未设置,跳过抓取"
            echo "xhs=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IDS_FILE="data-raw/xhs/note-ids.txt"
          ARGS=("--out-dir" "docs/xhs" "--raw-dir" "data-raw/xhs" "--img-dir" "images/xhs")
          if [ -f "$IDS_FILE" ]; then
            ARGS+=("--note-ids-file" "$IDS_FILE")
          else
            echo "ℹ️ $IDS_FILE 不存在(6d 搜索未产出/本地未填),跳过抓取"
            echo "xhs=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run crawl:xhs -- "${ARGS[@]}"
          XHS_COUNT=$(find docs/xhs -name '*.md' -type f ! -name 'INDEX.md' | wc -l | tr -d ' ')
          echo "xhs=$XHS_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ docs/xhs/ 共 $XHS_COUNT 篇小红书笔记已就绪"

      - name: 7. Ingest new HTML notes (Mode A · 半人工离线)
        id: ingest
        shell: bash
        run: |
          set -o pipefail
          if ! compgen -G "data-raw/html/*.html" > /dev/null; then
            echo "📭 data-raw/html/ 无 *.html 文件,跳过 ingest,仅刷新报告。"
            echo "ingested=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "📥 发现 HTML 文件,开始批量入库..."
          npm run ingest:batch -- --html-dir ./data-raw/html/ --concurrency 1
          # ingest-batch 写 _batch_report.json,从里面读 successCount
          if [ -f data-raw/_batch_report.json ]; then
            succ=$(node -e "const r=require('./data-raw/_batch_report.json');process.stdout.write(String(r.successCount ?? 0))")
          else
            succ="?"
          fi
          echo "ingested=$succ" >> "$GITHUB_OUTPUT"
          echo "本次成功入库条数: $succ"

      - name: 8. Dedupe (noteId / simhash / image sha256 / pHash)
        shell: bash
        run: npm run dedupe

      - name: 9. Validate dataset (gate · 失败则不 commit 半成品 XHS 数据,但已爬 docs/crawled/ 仍会 commit)
        id: validate
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/validate-dataset.ts --format json | tee /tmp/validate.json
          NOTE_COUNT=$(node -e "const r=require('/tmp/validate.json');process.stdout.write(String(r.counts?.rawJson ?? 0))")
          echo "note_count=$NOTE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$(node -e "const r=require('/tmp/validate.json');process.stdout.write(r.ok?'1':'0')")" = "0" ]; then
            echo "❌ validate 失败,停止后续 XHS 处理(但已爬 docs/crawled/ 仍会随本次 commit 推送)"
            exit 1
          fi

      - name: 10. Export topic coverage ranking
        id: export
        if: success() || steps.validate.outcome == 'success'
        shell: bash
        run: |
          npm run export:topics -- --coverage | tee /tmp/coverage.txt
          COV=$(grep -oP '覆盖率: +\K[0-9]+' /tmp/coverage.txt || echo 0)
          echo "topic_coverage=$COV" >> "$GITHUB_ENV"
          echo "topic_coverage=$COV" >> "$GITHUB_OUTPUT"

      - name: 11. Publish per-note browsable pages (docs/notes/<id>.md)
        id: publish
        if: success() || steps.validate.outcome == 'success'
        shell: bash
        run: |
          # 把每条 XHS 笔记(含正文+图片)渲染成可在 GitHub 直接浏览的 Markdown 页面
          npm run publish:notes -- --out-dir docs/notes
          NOTES_PUBLISHED=$(find docs/notes -name '*.md' -type f | wc -l | tr -d ' ')
          echo "notes_published=$NOTES_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "✅ docs/notes/ 共 $NOTES_PUBLISHED 个 .md 文件已就绪"

      - name: 12. Generate browseable docs/BROWSE.md
        if: always()
        shell: bash
        run: |
          mkdir -p docs
          NOTE_COUNT="${{ steps.validate.outputs.note_count || '0' }}"
          TOPIC_COV="${{ steps.export.outputs.topic_coverage || '0' }}"
          INGESTED="${{ steps.ingest.outputs.ingested || '0' }}"
          NOTES_PUB="${{ steps.publish.outputs.notes_published || '0' }}"
          CRAWLED="${{ steps.crawl.outputs.crawled || '0' }}"
          WIKI="${{ steps.wiki.outputs.wiki || '0' }}"
          WEIBO="${{ steps.weibo.outputs.weibo || '0' }}"
          XHS="${{ steps.xhs.outputs.xhs || '0' }}"
          {
            echo "# 📚 宁夏旅游 素材库 · 浏览总览"
            echo
            echo "> 由 GitHub Actions [\`Daily Ingest & Publish\`](../.github/workflows/daily-ingest-publish.yml) 自动维护 · 最后更新于 \`$(date -u '+%Y-%m-%d %H:%M UTC')\`"
            echo
            echo "## 📊 数据规模"
            echo
            echo "| 指标 | 数值 |"
            echo "|------|------|"
            echo "| 真实网站爬取内容(姊妹仓库) | $CRAWLED 篇 |"
            echo "| Wikipedia 宁夏相关词条 | $WIKI 篇 |"
            echo "| 微博宁夏相关帖(人工辅助登录 cookie) | $WEIBO 条 |"
            echo "| 小红书宁夏相关笔记(人工辅助登录 cookie) | $XHS 篇 |"
            echo "| XHS 笔记总数 | $NOTE_COUNT |"
            echo "| 话题覆盖率 | $TOPIC_COV% |"
            echo "| 本次新增 XHS(本次 run) | $INGESTED |"
            echo "| 可浏览 XHS 笔记页 | $NOTES_PUB |"
            echo
            echo "## 🌐 真实网站爬取内容"
            echo
            echo "### A. Wikipedia 宁夏相关词条(真爬 zh.wikipedia.org)"
            echo
            echo "**来源**:[zh.wikipedia.org](https://zh.wikipedia.org) 的宁夏行政区划、地理、景点、交通、文化等词条(全文纯文本 + 首图热链)。CC BY-SA 3.0,每页脚注标注原作者与原文链接。"
            echo
            echo "→ 入口:[docs/wikipedia/INDEX.md](./wikipedia/INDEX.md)(共 $WIKI 篇词条,点任意条目直接看全文)"
            echo
            echo "### B. 姊妹仓库 journal(Minkelxy/ningxia-tourism)"
            echo
            echo "**来源**:[Minkelxy/ningxia-tourism](https://github.com/Minkelxy/ningxia-tourism) 姊妹仓库的宁夏旅游 journal。"
            echo
            echo "→ 入口:[docs/crawled/INDEX.md](./crawled/INDEX.md)(共 $CRAWLED 篇真实内容,点任意条目直接看正文)"
            echo
            echo "### C. 微博(m.weibo.cn + 人工辅助登录 cookie)"
            echo
            echo "**来源**:[m.weibo.cn](https://m.weibo.cn) 关键词搜索(宁夏旅游/沙坡头/西夏王陵/贺兰山/银川/中卫/沙湖/六盘山/镇北堡/水洞沟)。cookie 由人工登录导出存为 GitHub Secret,脚本用 fetch+cookie 抓正文+图片,版权归原作者。"
            echo
            echo "→ 入口:[docs/weibo/INDEX.md](./weibo/INDEX.md)(共 $WEIBO 条微博,图片下载到本地引用)"
            echo
            echo "### D. 小红书(www.xiaohongshu.com + 人工辅助登录 cookie)"
            echo
            echo "**来源**:[www.xiaohongshu.com](https://www.xiaohongshu.com) explore 页(解析内嵌 __INITIAL_STATE__ JSON)。小红书 web 搜索 API 需要 x-s 签名,脚本难复现,故采用 noteId 列表方式:你在浏览器里浏览宁夏相关笔记,从 URL 末段取 noteId 写入 data-raw/xhs/note-ids.txt。cookie 由人工登录导出存为 GitHub Secret,脚本用 fetch+cookie 抓正文+图片,版权归原作者。"
            echo
            echo "→ 入口:[docs/xhs/INDEX.md](./xhs/INDEX.md)(共 $XHS 篇笔记,图片下载到本地引用)"
            echo
            echo "## 🔥 Top 20 按点赞数(XHS 笔记)"
            echo
            echo '```'
            python3 scripts/list-top.py -n 20 --sort likeCount 2>/dev/null || echo "(XHS 数据校验未通过,跳过)"
            echo '```'
            echo
            echo "## 🏷️ 话题覆盖率报告"
            echo
            echo '```'
            cat /tmp/coverage.txt 2>/dev/null || echo "(无)"
            echo '```'
            echo
            echo "## 🧭 如何浏览"
            echo
            echo "- 🌐 **Wikipedia 宁夏相关词条(主)**:[docs/wikipedia/INDEX.md](./wikipedia/INDEX.md) — 真爬 zh.wikipedia.org 的宁夏词条全文 + 首图"
            echo "- 🌐 **微博宁夏相关帖**:[docs/weibo/INDEX.md](./weibo/INDEX.md) — 人工辅助登录 cookie 抓 m.weibo.cn 正文+图片"
            echo "- 🌐 **小红书宁夏相关笔记**:[docs/xhs/INDEX.md](./xhs/INDEX.md) — 人工辅助登录 cookie 抓 www.xiaohongshu.com 正文+图片"
            echo "- 🌐 **姊妹仓库 journal**:[docs/crawled/INDEX.md](./crawled/INDEX.md) — 宁夏旅游 journal 镜像,可直接浏览"
            echo "- 📖 XHS 笔记可浏览页:[docs/notes/INDEX.md](./notes/INDEX.md) → 点 noteId 进入,正文+图片都在"
            echo "- 本仓库(原始数据 + 索引):https://github.com/${{ github.repository }}"
            echo "- 原始爬取落盘:[data-raw/crawled/](../data-raw/crawled/)"
            echo "- 索引文件:[data/notes-index.json](../data/notes-index.json)"
            echo "- 全量 NDJSON:[data/notes.ndjson](../data/notes.ndjson)"
            echo "- 话题热度榜:[TOPICS_RANKING.md](../TOPICS_RANKING.md)"
            echo
            echo "本地浏览(无需 Node):"
            echo '```bash'
            echo "python3 scripts/list-top.py -n 20 --sort likeCount"
            echo "python3 scripts/list-top.py --topic 沙坡头 --sort collectCount"
            echo '```'
          } > docs/BROWSE.md
          echo "✅ docs/BROWSE.md 已生成"
          ls -la TOPICS_RANKING.md 2>/dev/null || true

      - name: 13. Commit & push back to main
        if: always()
        shell: bash
        run: |
          set -o pipefail
          # 配置 git identity (steps.2 已设过,但 if:always 兜底)
          git config user.name  "github-actions[bot]" 2>/dev/null || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "✅ 今日完全无变更,跳过 commit/push"
            exit 0
          fi
          TODAY=$(date -u '+%Y-%m-%d')
          git commit -m "chore(data): daily ingest+crawl ${TODAY} — crawled=${{ steps.crawl.outputs.crawled || 0 }} wiki=${{ steps.wiki.outputs.wiki || 0 }} weibo=${{ steps.weibo.outputs.weibo || 0 }} xhs=${{ steps.xhs.outputs.xhs || 0 }} new=${{ steps.ingest.outputs.ingested || 0 }} notes=${{ steps.validate.outputs.note_count || 0 }}"
          git push origin HEAD
          echo "✅ 已推送到 https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"

      - name: 14. Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ingest-report-${{ github.run_id }}
          path: |
            docs/BROWSE.md
            docs/notes/
            docs/crawled/
            docs/wikipedia/
            docs/weibo/
            docs/xhs/
            /tmp/validate.json
            /tmp/coverage.txt
            TOPICS_RANKING.md
          retention-days: 30
          if-no-files-found: ignore

      - name: 15. Step Summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 📋 Daily Ingest & Publish 摘要

          | 项目 | 数值 |
          |------|------|
          | 真实网站爬取内容(姊妹仓库) | ${{ steps.crawl.outputs.crawled || 0 }} 篇 |
          | Wikipedia 宁夏相关词条 | ${{ steps.wiki.outputs.wiki || 0 }} 篇 |
          | 微博宁夏相关帖(cookie) | ${{ steps.weibo.outputs.weibo || 0 }} 条 |
          | 小红书 noteId 搜索数(cookie) | ${{ steps.xhs_search.outputs.xhs_search || 0 }} 个 |
          | 小红书宁夏相关笔记(cookie) | ${{ steps.xhs.outputs.xhs || 0 }} 篇 |
          | 本次新增 XHS 笔记 | ${{ steps.ingest.outputs.ingested || 0 }} |
          | XHS 笔记总数 | ${{ steps.validate.outputs.note_count || 0 }} |
          | 话题覆盖率 | ${{ steps.export.outputs.topic_coverage || 0 }}% |
          | 已发布 XHS 可浏览页 | ${{ steps.publish.outputs.notes_published || 0 }} |
          | 仓库 | https://github.com/${{ github.repository }} |
          | 浏览入口(BROWSE) | https://github.com/${{ github.repository }}/blob/main/docs/BROWSE.md |
          | 浏览入口(Wikipedia 目录) | https://github.com/${{ github.repository }}/blob/main/docs/wikipedia/INDEX.md |
          | 浏览入口(微博目录) | https://github.com/${{ github.repository }}/blob/main/docs/weibo/INDEX.md |
          | 浏览入口(小红书目录) | https://github.com/${{ github.repository }}/blob/main/docs/xhs/INDEX.md |
          | 浏览入口(姊妹仓库目录) | https://github.com/${{ github.repository }}/blob/main/docs/crawled/INDEX.md |
          | 浏览入口(XHS 目录) | https://github.com/${{ github.repository }}/blob/main/docs/notes/INDEX.md |

          EOF
