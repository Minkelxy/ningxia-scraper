# 宁夏旅游 XHS 素材库 · 关键词类目清单
# --------------------------------------------------
# 覆盖规则（AC-6）：本文件中每一个类目都必须在数据集中有 ≥1 条命中
# 命中判定：笔记的 topics[] 中包含关键词，或 geoHint 中 cityName/attractionName 包含
#
# 说明：关键词后面的 `aliases` 是命中的别名，用于模糊匹配
# （避免「沙坡头」与「中卫沙坡头景区」被当成不同类目）

categories:
  # ---------- 5 市（每个市至少 1 条） ----------
  - type: city
    name: 银川
    aliases: ["银川市", "银川旅游", "银川攻略", "银川周边"]
  - type: city
    name: 石嘴山
    aliases: ["石嘴山市", "石嘴山旅游", "大武口", "平罗"]
  - type: city
    name: 吴忠
    aliases: ["吴忠市", "吴忠旅游", "吴忠早茶", "青铜峡", "盐池"]
  - type: city
    name: 固原
    aliases: ["固原市", "固原旅游", "原州", "西吉", "隆德", "泾源", "彭阳"]
  - type: city
    name: 中卫
    aliases: ["中卫市", "中卫旅游", "中卫攻略", "沙坡头区", "中宁"]

  # ---------- 8 个 5A 景区（每个至少 1 条） ----------
  - type: attraction5a
    name: 沙坡头
    aliases: ["中卫沙坡头", "沙坡头景区", "沙坡头旅游区"]
  - type: attraction5a
    name: 沙湖
    aliases: ["石嘴山沙湖", "沙湖生态旅游区", "沙湖景区"]
  - type: attraction5a
    name: 镇北堡西部影城
    aliases: ["西部影城", "镇北堡", "银川影视城"]
  - type: attraction5a
    name: 水洞沟
    aliases: ["水洞沟遗址", "水洞沟景区", "灵武水洞沟"]
  - type: attraction5a
    name: 六盘山国家森林公园
    aliases: ["六盘山", "六盘山森林公园", "六盘山景区"]
  - type: attraction5a
    name: 火石寨
    aliases: ["西吉火石寨", "火石寨国家地质公园"]
  - type: attraction5a
    name: 须弥山石窟
    aliases: ["须弥山", "须弥山景区", "固原须弥山"]
  - type: attraction5a
    name: 西夏陵
    aliases: ["西夏王陵", "西夏陵景区", "银川西夏陵"]

  # ---------- 天数规划（1–5 天，每天数 ≥1 条） ----------
  - type: duration
    name: 宁夏1日游
    aliases: ["宁夏1天", "银川1天", "中卫1天", "宁夏一日游", "一日游"]
  - type: duration
    name: 宁夏2日游
    aliases: ["宁夏2天", "银川2天", "2天1晚", "两天一夜", "两日游"]
  - type: duration
    name: 宁夏3日游
    aliases: ["宁夏3天", "中卫3天", "3天2晚", "三天两夜", "三日游"]
  - type: duration
    name: 宁夏4日游
    aliases: ["宁夏4天", "4天3晚", "四天三夜", "四日游"]
  - type: duration
    name: 宁夏5日游
    aliases: ["宁夏5天", "宁夏全景", "5天4晚", "五天四夜", "五日游"]

  # ---------- 4 类主题玩法（每类 ≥1 条） ----------
  - type: theme
    name: 亲子游
    aliases: ["亲子", "带娃", "遛娃", "亲子宁夏", "小朋友"]
  - type: theme
    name: 自驾游
    aliases: ["自驾", "自驾游宁夏", "自驾攻略", "宁夏自驾", "大环线"]
  - type: theme
    name: 徒步露营
    aliases: ["徒步", "露营", "登山", "户外", "帐篷", "星空露营"]
  - type: theme
    name: 摄影
    aliases: ["摄影", "拍照", "打卡", "出片", "机位", "航拍"]

  # ---------- 4 类代表美食（每类 ≥1 条） ----------
  - type: food
    name: 吴忠早茶
    aliases: ["吴忠早茶文化", "早茶", "盖碗茶", "八宝茶"]
  - type: food
    name: 手抓羊肉
    aliases: ["手抓", "宁夏手抓羊肉", "盐池滩羊", "国强手抓"]
  - type: food
    name: 蒿子面
    aliases: ["蒿籽面", "中宁蒿子面", "中卫蒿子面"]
  - type: food
    name: 烩肉
    aliases: ["烩小吃", "烩羊杂碎", "羊杂碎", "宁夏烩肉", "烩羊杂"]

# --------------------------------------------------
# 统计：共 5 市 + 8 5A + 5 天数 + 4 主题 + 4 美食 = 26 类目
# AC-6 覆盖率目标：26/26 = 100%
# --------------------------------------------------
